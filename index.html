  html { scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar { display: none; width: 0; height: 0; }
  body {

  }
  .container { max-width: 820px; margin: 0 auto; }

  /* Header */
  .header {

    color: #fff;
    border-radius: 10px;
    padding: 14px 20px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(30,108,182,0.15);
    text-align: center;
  }
  .header h1 { font-size: 22px; font-weight: 600; margin-bottom: 5px; letter-spacing: 1px; }
  .header .meta { font-size: 14px; opacity: 0.9; display: flex; justify-content: center; gap: 24px; }

  /* Summary Cards */
  .summary { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .card {
    flex: 1;
    min-width: 110px;
    border-radius: 8px;
    padding: 7px 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    text-align: center;
    color: #fff;
  }
  .card .label { font-size: 13px; font-weight: 600; opacity: 0.95; }
  .card .value { font-size: 30px; font-weight: 800; line-height: 1.1; margin-top: 1px; }
  .card.online { background: linear-gradient(135deg, #10b981, #34d399); }
  .card.installed { background: linear-gradient(135deg, #3b82f6, #60a5fa); }
  .card.accepted { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
  .card.contact { background: linear-gradient(135deg, #64748b, #94a3b8); }
  .card.rejected { background: linear-gradient(135deg, #ef4444, #f87171); }

  /* Completion Rate Bar - 分母固定50 */
  .rate-bar {
    background: #fff;
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .rate-bar .rate-label { font-size: 14px; color: #475569; white-space: nowrap; font-weight: 600; }
  .rate-bar .bar-bg {
    flex: 1;
    height: 18px;
    background: #e2e8f0;
    border-radius: 9px;
    overflow: hidden;
  }
  .rate-bar .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #10b981, #34d399);
    border-radius: 9px;
    transition: width 0.6s ease;
  }
  .rate-bar .rate-text { font-size: 16px; font-weight: 700; color: #10b981; white-space: nowrap; }

  /* Search Bar */
  .search-bar { margin-bottom: 10px; }
  .search-bar input {
    width: 100%;
    padding: 9px 14px;
    font-size: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    outline: none;
    box-sizing: border-box;
    font-family: inherit;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .search-bar input:focus {
    border-color: #2b8fd6;
    box-shadow: 0 0 0 2px rgba(43,143,214,0.1);
  }
  .search-bar input::placeholder { color: #94a3b8; }

  /* Section */
  .section {
    background: #fff;
    border-radius: 8px;
    margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    overflow: hidden;
  }
  .section-header {
    padding: 7px 12px;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #e2e8f0;
  }
  .section-header .dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .section-header .count {
    font-size: 14px; font-weight: 700; color: #64748b;
    margin-left: auto;
    background: #f1f5f9;
    border-radius: 12px;
    padding: 2px 10px;
  }
  .section.online .section-header .count { color: #15803d; background: #dcfce7; }
  .section.rejected .section-header .count { color: #b91c1c; background: #fee2e2; }
  .section.installed .section-header .count { color: #1d4ed8; background: #dbeafe; }
  .section.accepted .section-header .count { color: #b45309; background: #fef3c7; }
  .section.contact .section-header .count { color: #475569; background: #e2e8f0; }
  .section.online .section-header { background: #f0fdf4; color: #15803d; }
  .section.online .dot { background: #10b981; }
  .section.rejected .section-header { background: #fef2f2; color: #b91c1c; }
  .section.rejected .dot { background: #ef4444; }
  .section.installed .section-header { background: #eff6ff; color: #1d4ed8; }
  .section.installed .dot { background: #3b82f6; }
  .section.accepted .section-header { background: #fffbeb; color: #b45309; }
  .section.accepted .dot { background: #f59e0b; }
  .section.contact .section-header { background: #f8fafc; color: #475569; }
  .section.contact .dot { background: #64748b; }

  /* 已上线 - 网格布局 */
  .grid-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 0;
  }
  .grid-item {
    padding: 4px 10px;
    border-bottom: 1px solid #d1d5db;
    border-right: 1px solid #d1d5db;
  }
  .grid-item .g-name {
    font-size: 14px; font-weight: 700; color: #0f172a; margin-bottom: 1px;
    line-height: 1.3; white-space: nowrap;
  }
  .grid-item .g-license {
    font-size: 12px; color: #475569; line-height: 1.3; font-weight: 500; white-space: nowrap;
  }

  /* 其他分类 - 双列卡片布局 */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0;
  }
  .card-item {
    padding: 4px 10px;
    border-bottom: 1px solid #d1d5db;
    border-right: 1px solid #d1d5db;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-item-right { flex: 0 0 auto; max-width: 62%; min-width: 0; }
  .card-item .c-name {
    font-size: 14px; font-weight: 700; color: #0f172a; line-height: 1.3; margin-bottom: 1px;

  }
  .card-item .c-license {
    font-size: 12px; color: #475569; line-height: 1.3; font-weight: 500; white-space: nowrap;

  .nw { white-space: nowrap; }

  .card-item.narrow-right .card-item-right { max-width: 38%; }
  .card-item .c-desc {
    font-size: 13px; color: #475569; line-height: 1.35; text-align: right;
  }
  .card-item .c-desc.empty { color: #cbd5e1; font-style: italic; }
  .card-item .c-license.empty { color: #cbd5e1; font-style: italic; }

  /* 用户拒绝 - 右侧拒绝原因垂直居中 */
  .card-item.desc-center {
    align-items: center;
  }

  /* 外卖厨房标签 */
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: #c2410c;
    background: #ffedd5;
    border: 1px solid #fdba74;
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 6px;
    vertical-align: 1px;
    white-space: nowrap;
  }

    body { padding: 6px; }

    .summary { display: flex; flex-wrap: wrap; gap: 6px; }
    .summary .card.online { flex: 1 1 100%; min-width: 100%; }

    .card { padding: 6px 6px; border-radius: 6px; text-align: center; }
    .card .label { font-size: 11px; }
    .card .value { font-size: 22px; }
    .rate-bar { flex-wrap: wrap; gap: 6px; padding: 8px 12px; }
    .rate-bar .rate-label { font-size: 12px; }
    .rate-bar .rate-text { font-size: 14px; }
    .section-header { font-size: 15px; padding: 8px 12px; }
    .section-header .count { font-size: 12px; padding: 2px 10px; }
    .grid-list { grid-template-columns: 1fr; }
    .grid-item { border-right: none; padding: 5px 12px; }
    .grid-item .g-name { font-size: 13px; }
    .grid-item .g-license { font-size: 11px; }
    /* 其他分类：手机端保持双列，不居中，名称不换行，说明可换行 */
    .search-bar input { padding: 8px 12px; font-size: 13px; }

    .card-item.full-width { flex-basis: 100%; border-right: none; }
    .card-item-left { flex: none; width: 100%; }
    .card-item-right { max-width: none; width: 100%; }

    .card-item .c-desc { font-size: 11px; white-space: normal; word-break: normal; text-align: left; }
    .card-item.desc-center { align-items: flex-start; }
    .tag { font-size: 10px; margin-left: 4px; padding: 0 4px; }
  }

  .footer {
    text-align: center;
    padding: 14px;
    font-size: 16px;

  {name:"广州市越秀区天咖扉扒房",license:"广州市越秀区天咖扉扒房",status:"已联系",desc:"待跟进"},
  {name:"田果小巷",license:"广州果乐园管理有限公司",status:"已联系",desc:"待跟进"},
  {name:"慕茶山",license:"广东慕茶山管理有限公司越秀区惠吉西第二分公司",status:"已联系",desc:"待跟进"},
  {name:"赵大叔的店",license:"广州市越秀区丁香食品店",status:"已联系",desc:"待跟进"},
  {name:"猪朋狗友咖啡店",license:"",status:"已联系",desc:"待跟进"}
];

const TARGET = 50; // 完成率目标值

// 外卖厨房商户名单（始终打标，不受进展状态影响）
const TAKEOUT_KITCHENS = ["太太茶餐厅","吞口熊","多美丽炸鸡","叫了只炸鸡","农耕记","如轩砂锅粥","麦稻中式健康餐","永利来餐室","牛山爷嫩牛五方","囍膳小厨 养生汤","将相王者·黄焖鸡米饭（纪念堂店）","厚切猪扒咖喱饭（虾首富）"];

function tagHtml(name) {
  return TAKEOUT_KITCHENS.includes(name) ? '<span class="tag">外卖厨房</span>' : '';
}

const CATEGORIES = [
  { key:"已上线", cls:"online", label:"已上线", useGrid:true },
  { key:"用户拒绝", cls:"rejected", label:"用户拒绝", useGrid:false, descHeader:"拒绝原因", descCenter:true },
  { key:"已安装", cls:"installed", label:"已安装", useGrid:false, descHeader:"进度说明" },
  { key:"已受理", cls:"accepted", label:"已受理", useGrid:false, descHeader:"进度说明" },
  { key:"已联系", cls:"contact", label:"已联系", useGrid:false, descHeader:"进度说明" }
];

function renderCardGrid(items, descHeader, descCenter) {
  let html = '';
  items.forEach(d => {
    const descText = d.desc || '—';
    const descClass = d.desc ? '' : 'empty';
    const licText = d.license || '—';
    const licClass = d.license ? '' : 'empty';
    html += '<div class="card-item' + (descCenter ? ' desc-center' : '') + '">'
      + '<div class="card-item-left">'
      + '<div class="c-name">'+esc(d.name)+tagHtml(d.name)+'</div>'
      + '<div class="c-license '+licClass+'">'+licText+'</div>'
      + '</div>'
      + '<div class="card-item-right">'
      + '<div class="c-desc '+descClass+'">'+descText+'</div>'
      + '</div>'
      + '</div>';
  });
  return '<div class="card-grid">'+html+'</div>';
}

function esc(s) { return s ? s : ''; }

// Render summary cards
const summaryEl = document.getElementById('summary');
CATEGORIES.forEach(cat => {
  const count = DATA.filter(d => d.status === cat.key).length;
  summaryEl.innerHTML += '<div class="card '+cat.cls+'"><div class="label">'+cat.label+' 占比'+((count/DATA.length)*100).toFixed(1)+'%</div><div class="value">'+count+'</div></div>';
});

// Render completion rate bar - 分母固定50
const onlineCount = DATA.filter(d => d.status === "已上线").length;
const ratePct = ((onlineCount / TARGET) * 100).toFixed(1);
const barWidth = Math.min(parseFloat(ratePct), 100);
document.getElementById('rateBar').innerHTML = '<span class="rate-label">上线完成率</span><div class="bar-bg"><div class="bar-fill" style="width:'+barWidth+'%"></div></div><span class="rate-text">'+onlineCount+'/'+TARGET+'（'+ratePct+'%）</span>';

// —— 单行适配：名称/执照超宽时智能缩小字号保持一行，避免换行或裁切 ——
function fitSingleLine(el, minSize) {
  if (!el) return true;
  if (el.scrollWidth <= el.clientWidth + 0.5) return true;
  let size = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth + 0.5 && size > minSize) {
    size -= 0.5;
    el.style.fontSize = size + 'px';
  }
  if (el.scrollWidth > el.clientWidth + 0.5) {
    let ls = 0;
    while (el.scrollWidth > el.clientWidth + 0.5 && ls > -0.6) {
      ls -= 0.1;
      el.style.letterSpacing = ls + 'px';
    }
  }
  return el.scrollWidth <= el.clientWidth + 0.5;
}
function resetFit(el) {
  if (!el) return;
  el.style.fontSize = '';
  el.style.letterSpacing = '';
}
function fitCardItem(item) {
  const nameEl = item.querySelector('.c-name');
  const licEl = item.querySelector('.c-license');
  item.classList.remove('narrow-right');
  resetFit(nameEl); resetFit(licEl);
  let ok = fitSingleLine(nameEl, 10) & fitSingleLine(licEl, 9.5);
  if (!ok) {
    item.classList.add('narrow-right');
    resetFit(nameEl); resetFit(licEl);
    fitSingleLine(nameEl, 10);
    fitSingleLine(licEl, 9.5);
  }
}

// —— 手机端：卡片超屏自动换行为1列 ——
function adjustMobileLayout() {
  if (window.innerWidth > 640) return;
  var items = Array.from(document.querySelectorAll('.card-item'));
  items.forEach(function(item) {
    item.classList.remove('full-width');
    item.style.borderRight = '';
  });
  document.body.offsetHeight; // force reflow
  var col = 0;
  items.forEach(function(item) {
    var nameEl = item.querySelector('.c-name');
    var licEl = item.querySelector('.c-license');
    var truncated = false;
    if (nameEl && nameEl.scrollWidth > nameEl.clientWidth + 0.5) truncated = true;
    if (licEl && licEl.scrollWidth > licEl.clientWidth + 0.5) truncated = true;
    if (truncated) {
      item.classList.add('full-width');
      resetFit(nameEl); resetFit(licEl);
      fitSingleLine(nameEl, 10);
      fitSingleLine(licEl, 9.5);
      item.style.borderRight = 'none';
      col = 0;
    } else {
      if (col === 1) { item.style.borderRight = 'none'; col = 0; }
      else { item.style.borderRight = '1px solid #d1d5db'; col = 1; }
    }
  });
}

// —— 渲染分类区块（支持搜索过滤） ——
function renderSections(filterFn) {
  const sectionsEl = document.getElementById('sections');
  sectionsEl.innerHTML = '';
  CATEGORIES.forEach(cat => {
    let items = DATA.filter(d => d.status === cat.key);
    if (filterFn) items = items.filter(filterFn);
    if (items.length === 0) return;

    let body = '';
    if (cat.useGrid) {
      let gridItems = '';
      items.forEach(d => {
        gridItems += '<div class="grid-item"><div class="g-name">'+esc(d.name)+tagHtml(d.name)+'</div><div class="g-license">'+(d.license||'—')+'</div></div>';
      });
      body = '<div class="grid-list">'+gridItems+'</div>';
    } else {
      body = renderCardGrid(items, cat.descHeader, cat.descCenter);
    }

    sectionsEl.innerHTML += '<div class="section '+cat.cls+'"><div class="section-header"><span class="dot"></span><span>'+cat.label+'</span><span class="count">共 '+items.length+' 户</span></div>'+body+'</div>';
  });

  if (filterFn && sectionsEl.children.length === 0) {
    sectionsEl.innerHTML = '<div style="text-align:center;padding:30px;color:#94a3b8;font-size:14px;">未找到匹配的商户</div>';
  }

  document.querySelectorAll('.card-item').forEach(fitCardItem);
  document.querySelectorAll('.grid-item').forEach(function(item) {
    fitSingleLine(item.querySelector('.g-name'), 10);
    fitSingleLine(item.querySelector('.g-license'), 9.5);
  });
  adjustMobileLayout();
  fitSingleLine(document.querySelector('.footer'), 12);
}

// —— 搜索功能 ——
const searchInput = document.getElementById('searchInput');
let searchTimer = null;
searchInput.addEventListener('input', function() {
  clearTimeout(searchTimer);
  var q = this.value.trim().toLowerCase();
  searchTimer = setTimeout(function() {
    if (!q) { renderSections(null); return; }
    renderSections(function(d) {
      return d.name.toLowerCase().indexOf(q) >= 0 ||
             (d.license && d.license.toLowerCase().indexOf(q) >= 0);
    });
  }, 150);
});

// —— 首次渲染 ——
renderSections(null);
</script>
