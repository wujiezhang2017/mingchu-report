  html { scrollbar-width: none; -ms-overflow-style: none; }

  body {

  .header {

    color: #fff;
    border-radius: 10px;
    padding: 14px 20px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(30,108,182,0.15);
    text-align: center;
  }
  .header h1 { font-size: 22px; font-weight: 600; margin-bottom: 5px; letter-spacing: 1px; }
  .header .meta { font-size: 14px; opacity: 0.9; display: flex; justify-content: center; gap: 24px; }

  /* Summary Cards */
  .summary { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .card {
    flex: 1;
    min-width: 110px;
    border-radius: 8px;
    padding: 12px 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    text-align: center;
    color: #fff;
  }
  .card .label { font-size: 14px; margin-bottom: 2px; font-weight: 600; opacity: 0.95; }
  .card .value { font-size: 36px; font-weight: 800; line-height: 1.1; }
  .card .pct { font-size: 11px; margin-top: 2px; opacity: 0.85; }
  .card.online { background: linear-gradient(135deg, #10b981, #34d399); }
  .card.installed { background: linear-gradient(135deg, #3b82f6, #60a5fa); }
  .card.accepted { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
  .card.contact { background: linear-gradient(135deg, #64748b, #94a3b8); }
  .card.rejected { background: linear-gradient(135deg, #ef4444, #f87171); }

  /* Completion Rate Bar - 分母固定50 */
  .rate-bar {
    background: #fff;
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .rate-bar .rate-label { font-size: 14px; color: #475569; white-space: nowrap; font-weight: 600; }
  .rate-bar .bar-bg {
    flex: 1;
    height: 18px;
    background: #e2e8f0;
    border-radius: 9px;
    overflow: hidden;
  }
  .rate-bar .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #10b981, #34d399);
    border-radius: 9px;
    transition: width 0.6s ease;
  }
  .rate-bar .rate-text { font-size: 16px; font-weight: 700; color: #10b981; white-space: nowrap; }

  /* Section */
  .section {
    background: #fff;
    border-radius: 8px;
    margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    overflow: hidden;
  }
  .section-header {
    padding: 7px 12px;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #e2e8f0;
  }
  .section-header .dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .section-header .count {
    font-size: 14px; font-weight: 700; color: #64748b;
    margin-left: auto;
    background: #f1f5f9;
    border-radius: 12px;
    padding: 2px 10px;
  }
  .section.online .section-header .count { color: #15803d; background: #dcfce7; }
  .section.rejected .section-header .count { color: #b91c1c; background: #fee2e2; }
  .section.installed .section-header .count { color: #1d4ed8; background: #dbeafe; }
  .section.accepted .section-header .count { color: #b45309; background: #fef3c7; }
  .section.contact .section-header .count { color: #475569; background: #e2e8f0; }
  .section.online .section-header { background: #f0fdf4; color: #15803d; }
  .section.online .dot { background: #10b981; }
  .section.rejected .section-header { background: #fef2f2; color: #b91c1c; }
  .section.rejected .dot { background: #ef4444; }
  .section.installed .section-header { background: #eff6ff; color: #1d4ed8; }
  .section.installed .dot { background: #3b82f6; }
  .section.accepted .section-header { background: #fffbeb; color: #b45309; }
  .section.accepted .dot { background: #f59e0b; }
  .section.contact .section-header { background: #f8fafc; color: #475569; }
  .section.contact .dot { background: #64748b; }

  /* 已上线 - 网格布局 */
  .grid-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 0;
  }
  .grid-item {
    padding: 4px 10px;
    border-bottom: 1px solid #d1d5db;
    border-right: 1px solid #d1d5db;
  }
  .grid-item .g-name {

  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0;
  }
  .card-item {
    padding: 4px 10px;
    border-bottom: 1px solid #d1d5db;
    border-right: 1px solid #d1d5db;
    display: flex;
    align-items: center;

  .card-item-right { flex: 0 0 auto; max-width: 62%; min-width: 0; }
  .card-item .c-name {
    font-size: 14px; font-weight: 700; color: #0f172a; line-height: 1.3; margin-bottom: 1px;
    white-space: nowrap;
  }
  .card-item .c-license {
    font-size: 12px; color: #475569; line-height: 1.3; font-weight: 500; white-space: nowrap;

  .card-item.narrow-right .card-item-right { max-width: 38%; }
  .card-item .c-desc {
    font-size: 13px; color: #475569; line-height: 1.35;
  }
  .card-item .c-desc.empty { color: #cbd5e1; font-style: italic; }
  .card-item .c-license.empty { color: #cbd5e1; font-style: italic; }

  .card-item.desc-center {

    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: #c2410c;
    background: #ffedd5;
    border: 1px solid #fdba74;
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 6px;
    vertical-align: 1px;
    white-space: nowrap;
  }

    .header h1 { font-size: 17px; }
    .header .meta { font-size: 12px; gap: 12px; flex-wrap: wrap; }
    .summary { gap: 6px; }

    .card-item .c-desc { font-size: 12px; }
    .tag { font-size: 10px; margin-left: 4px; padding: 0 4px; }

    text-align: center;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    color: #334155;
    white-space: nowrap;

    const descText = d.desc || '—';
    const descClass = d.desc ? '' : 'empty';
    const licText = d.license || '—';
    const licClass = d.license ? '' : 'empty';
    html += '<div class="card-item' + (descCenter ? ' desc-center' : '') + '">'
      + '<div class="card-item-left">'
      + '<div class="c-name">'+esc(d.name)+tagHtml(d.name)+'</div>'
      + '<div class="c-license '+licClass+'">'+licText+'</div>'
      + '</div>'
      + '<div class="card-item-right">'
      + '<div class="c-desc '+descClass+'">'+descText+'</div>'
      + '</div>'
      + '</div>';
  });
  return '<div class="card-grid">'+html+'</div>';
}

function esc(s) { return s ? s : ''; }

// Render summary cards
const summaryEl = document.getElementById('summary');
CATEGORIES.forEach(cat => {
  const count = DATA.filter(d => d.status === cat.key).length;
  summaryEl.innerHTML += '<div class="card '+cat.cls+'"><div class="label">'+cat.label+'</div><div class="value">'+count+'</div><div class="pct">占比 '+((count/DATA.length)*100).toFixed(1)+'%</div></div>';
});

// Render completion rate bar - 分母固定50
const onlineCount = DATA.filter(d => d.status === "已上线").length;
const ratePct = ((onlineCount / TARGET) * 100).toFixed(1);
const barWidth = Math.min(parseFloat(ratePct), 100);
document.getElementById('rateBar').innerHTML = '<span class="rate-label">上线完成率</span><div class="bar-bg"><div class="bar-fill" style="width:'+barWidth+'%"></div></div><span class="rate-text">'+onlineCount+'/'+TARGET+'（'+ratePct+'%）</span>';

// Render sections
const sectionsEl = document.getElementById('sections');
CATEGORIES.forEach(cat => {
  const items = DATA.filter(d => d.status === cat.key);
  if (items.length === 0) return;

  let body = '';
  if (cat.useGrid) {
    // 已上线 - 网格布局，只展示客户名称和营业执照
    let gridItems = '';
    items.forEach(d => {
      gridItems += '<div class="grid-item"><div class="g-name">'+esc(d.name)+tagHtml(d.name)+'</div><div class="g-license">'+(d.license||'—')+'</div></div>';
    });
    body = '<div class="grid-list">'+gridItems+'</div>';
  } else {
    // 其他分类 - 双列卡片布局
    body = renderCardGrid(items, cat.descHeader, cat.descCenter);
  }

  sectionsEl.innerHTML += '<div class="section '+cat.cls+'"><div class="section-header"><span class="dot"></span><span>'+cat.label+'</span><span class="count">共 '+items.length+' 户</span></div>'+body+'</div>';
});

// —— 单行适配：名称/执照超宽时智能缩小字号保持一行，避免换行或裁切 ——
function fitSingleLine(el, minSize) {
  if (!el) return true;
  if (el.scrollWidth <= el.clientWidth + 0.5) return true;
  let size = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth + 0.5 && size > minSize) {
    size -= 0.5;
    el.style.fontSize = size + 'px';
  }
  if (el.scrollWidth > el.clientWidth + 0.5) {
    let ls = 0;
    while (el.scrollWidth > el.clientWidth + 0.5 && ls > -0.6) {
      ls -= 0.1;
      el.style.letterSpacing = ls + 'px';
    }
  }
  return el.scrollWidth <= el.clientWidth + 0.5;
}
function resetFit(el) {
  if (!el) return;
  el.style.fontSize = '';
  el.style.letterSpacing = '';
}
function fitCardItem(item) {
  const nameEl = item.querySelector('.c-name');
  const licEl = item.querySelector('.c-license');
  item.classList.remove('narrow-right');
  resetFit(nameEl); resetFit(licEl);
  let ok = fitSingleLine(nameEl, 10) & fitSingleLine(licEl, 9.5);
  if (!ok) {
    // 名称缩到下限仍放不下：收窄右侧说明列（说明允许换行），重新适配
    item.classList.add('narrow-right');
    resetFit(nameEl); resetFit(licEl);
    fitSingleLine(nameEl, 10);
    fitSingleLine(licEl, 9.5);
  }
}
document.querySelectorAll('.card-item').forEach(fitCardItem);
document.querySelectorAll('.grid-item').forEach(function(item) {
  fitSingleLine(item.querySelector('.g-name'), 10);
  fitSingleLine(item.querySelector('.g-license'), 9.5);
});
// 底部落款：窄屏放不下时智能缩字号保持一行
fitSingleLine(document.querySelector('.footer'), 12);
</script>
