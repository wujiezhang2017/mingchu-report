<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>明厨亮灶专项行动 · 六榕所辖区跟进汇报</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  /* 隐藏滚动条：保证截图宽度=视口宽度，两侧留空对称（滚轮滚动不受影响） */
  html { scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar { display: none; width: 0; height: 0; }
  body {
    font-family: "Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
    background: #f0f4f8;
    color: #1a202c;
    padding: 12px;
  }
  .container { max-width: 820px; margin: 0 auto; }

  /* Header */
  .header {
    background: linear-gradient(135deg, #1e6cb6, #2b8fd6);
    color: #fff;
    border-radius: 10px;
    padding: 14px 20px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(30,108,182,0.15);
    text-align: center;
  }
  .header h1 { font-size: 22px; font-weight: 600; margin-bottom: 5px; letter-spacing: 1px; }
  .header .meta { font-size: 14px; opacity: 0.9; display: flex; justify-content: center; gap: 24px; }

  /* Summary Cards */
  .summary { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .card {
    flex: 1;
    min-width: 110px;
    border-radius: 8px;
    padding: 7px 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    text-align: center;
    color: #fff;
  }
  .card .label { font-size: 13px; font-weight: 600; opacity: 0.95; }
  .card .value { font-size: 30px; font-weight: 800; line-height: 1.1; margin-top: 1px; }
  .card.online { background: linear-gradient(135deg, #10b981, #34d399); }
  .card.installed { background: linear-gradient(135deg, #3b82f6, #60a5fa); }
  .card.accepted { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
  .card.contact { background: linear-gradient(135deg, #64748b, #94a3b8); }
  .card.rejected { background: linear-gradient(135deg, #ef4444, #f87171); }

  /* Completion Rate Bar - 分母固定50 */
  .rate-bar {
    background: #fff;
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .rate-bar .rate-label { font-size: 14px; color: #475569; white-space: nowrap; font-weight: 600; }
  .rate-bar .bar-bg {
    flex: 1;
    height: 18px;
    background: #e2e8f0;
    border-radius: 9px;
    overflow: hidden;
  }
  .rate-bar .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #10b981, #34d399);
    border-radius: 9px;
    transition: width 0.6s ease;
  }
  .rate-bar .rate-text { font-size: 16px; font-weight: 700; color: #10b981; white-space: nowrap; }

  /* Search Bar */
  .search-bar { margin-bottom: 10px; }
  .search-bar input {
    width: 100%;
    padding: 9px 14px;
    font-size: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    outline: none;
    box-sizing: border-box;
    font-family: inherit;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .search-bar input:focus {
    border-color: #2b8fd6;
    box-shadow: 0 0 0 2px rgba(43,143,214,0.1);
  }
  .search-bar input::placeholder { color: #94a3b8; }

  /* 搜索行：输入框 + 导出按钮 */
  .search-row { display: flex; gap: 8px; align-items: stretch; }
  .search-row input { flex: 1; min-width: 0; }
  .btn-export {
    flex-shrink: 0;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.10);
    font-family: inherit;
    white-space: nowrap;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .btn-export:hover { filter: brightness(1.06); }
  .btn-export:active { transform: translateY(1px); }
  .btn-excel { background: linear-gradient(135deg, #16a34a, #22c55e); }
  .btn-print { background: linear-gradient(135deg, #2563eb, #3b82f6); }

  /* Section */
  .section {
    background: #fff;
    border-radius: 8px;
    margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    overflow: hidden;
  }
  .section-header {
    padding: 7px 12px;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #e2e8f0;
  }
  .section-header .dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .section-header .count {
    font-size: 14px; font-weight: 700; color: #64748b;
    margin-left: auto;
    background: #f1f5f9;
    border-radius: 12px;
    padding: 2px 10px;
  }
  .section.online .section-header .count { color: #15803d; background: #dcfce7; }
  .section.rejected .section-header .count { color: #b91c1c; background: #fee2e2; }
  .section.installed .section-header .count { color: #1d4ed8; background: #dbeafe; }
  .section.accepted .section-header .count { color: #b45309; background: #fef3c7; }
  .section.contact .section-header .count { color: #475569; background: #e2e8f0; }
  .section.online .section-header { background: #f0fdf4; color: #15803d; }
  .section.online .dot { background: #10b981; }
  .section.rejected .section-header { background: #fef2f2; color: #b91c1c; }
  .section.rejected .dot { background: #ef4444; }
  .section.installed .section-header { background: #eff6ff; color: #1d4ed8; }
  .section.installed .dot { background: #3b82f6; }
  .section.accepted .section-header { background: #fffbeb; color: #b45309; }
  .section.accepted .dot { background: #f59e0b; }
  .section.contact .section-header { background: #f8fafc; color: #475569; }
  .section.contact .dot { background: #64748b; }

  /* 已上线 - 网格布局 */
  .grid-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 0;
  }
  .grid-item {
    padding: 4px 10px;
    border-bottom: 1px solid #d1d5db;
    border-right: 1px solid #d1d5db;
  }
  .grid-item .g-name {
    font-size: 14px; font-weight: 700; color: #0f172a; margin-bottom: 1px;
    line-height: 1.3; white-space: nowrap;
  }
  .grid-item .g-license {
    font-size: 12px; color: #475569; line-height: 1.3; font-weight: 500; white-space: nowrap;
  }

  /* 其他分类 - 双列卡片布局 */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0;
  }
  .card-item {
    padding: 4px 10px;
    border-bottom: 1px solid #d1d5db;
    border-right: 1px solid #d1d5db;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card-item-left { flex: 1 1 auto; min-width: 0; }
  .card-item-right { flex: 0 0 auto; max-width: 62%; min-width: 0; }
  .card-item .c-name {
    font-size: 14px; font-weight: 700; color: #0f172a; line-height: 1.3; margin-bottom: 1px;
    white-space: nowrap;
  }
  .card-item .c-license {
    font-size: 12px; color: #475569; line-height: 1.3; font-weight: 500; white-space: nowrap;
  }
  .nw { white-space: nowrap; }
  /* 单行适配后仍超宽的条目：收窄右侧说明列，给左侧名称让位 */
  .card-item.narrow-right .card-item-right { max-width: 38%; }
  .card-item .c-desc {
    font-size: 13px; color: #475569; line-height: 1.35; text-align: right;
  }
  .card-item .c-desc.empty { color: #cbd5e1; font-style: italic; }
  .card-item .c-license.empty { color: #cbd5e1; font-style: italic; }

  /* 用户拒绝 - 右侧拒绝原因垂直居中 */
  .card-item.desc-center {
    align-items: center;
  }

  /* 外卖厨房标签 */
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: #c2410c;
    background: #ffedd5;
    border: 1px solid #fdba74;
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 6px;
    vertical-align: 1px;
    white-space: nowrap;
  }

  /* 手机端 */
  @media (max-width: 640px) {
    body { padding: 6px; }
    .header { padding: 10px 14px; }
    .header h1 { font-size: 17px; }
    .header .meta { font-size: 12px; gap: 12px; flex-wrap: wrap; }
    /* 汇总卡片：已上线独占一行，其余4个分2行每行2个 */
    .summary { display: flex; flex-wrap: wrap; gap: 6px; }
    .summary .card.online { flex: 1 1 100%; min-width: 100%; }
    .summary .card:not(.online) { flex: 1 1 calc(50% - 3px); min-width: calc(50% - 3px); }
    .card { padding: 6px 6px; border-radius: 6px; text-align: center; }
    .card .label { font-size: 11px; }
    .card .value { font-size: 22px; }
    .rate-bar { flex-wrap: wrap; gap: 6px; padding: 8px 12px; }
    .rate-bar .rate-label { font-size: 12px; }
    .rate-bar .rate-text { font-size: 14px; }
    .section-header { font-size: 15px; padding: 8px 12px; }
    .section-header .count { font-size: 12px; padding: 2px 10px; }
    .grid-list { grid-template-columns: 1fr; }
    .grid-item { border-right: none; padding: 5px 12px; }
    .grid-item .g-name { font-size: 13px; }
    .grid-item .g-license { font-size: 11px; }
    /* 其他分类：手机端保持双列，不居中，名称不换行，说明可换行 */
    .search-bar input { padding: 8px 12px; font-size: 13px; }
    .search-row { flex-wrap: wrap; }
    .search-row input { flex: 1 1 100%; }
    .btn-export { flex: 1 1 auto; padding: 8px 10px; font-size: 13px; }
    /* 其他分类：手机端 flex-wrap，超屏卡片自动占满一行 */
    .card-grid { display: flex; flex-wrap: wrap; }
    .card-item { flex: 1 1 50%; min-width: 0; border-right: 1px solid #d1d5db; padding: 4px 8px; flex-direction: column; gap: 2px; align-items: flex-start; text-align: left; }
    .card-item.full-width { flex-basis: 100%; border-right: none; }
    .card-item-left { flex: none; width: 100%; }
    .card-item-right { max-width: none; width: 100%; }
    .card-item.narrow-right .card-item-right { max-width: none; }
    .card-item .c-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-item .c-license { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-item .c-desc { font-size: 11px; white-space: normal; word-break: normal; text-align: left; }
    .card-item.desc-center { align-items: flex-start; }
    .tag { font-size: 10px; margin-left: 4px; padding: 0 4px; }
  }

  .footer {
    text-align: center;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    color: #334155;
    white-space: nowrap;
  }

  /* A4打印图片选择弹窗（毛玻璃） */
  .modal-mask {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 100;
    background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: rgba(255, 255, 255, 0.94);
    border-radius: 12px;
    padding: 18px 20px 16px;
    max-width: 420px; width: 100%;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
  }
  .modal h3 { font-size: 16px; color: #0f172a; margin-bottom: 12px; text-align: center; }
  .modal .modal-item {
    display: block; padding: 11px 14px; margin: 8px 0;
    background: #eff6ff; border: 1px solid #dbeafe; border-radius: 8px;
    text-decoration: none; color: #1d4ed8; font-size: 14px; font-weight: 600;
  }
  .modal .modal-item:hover { background: #dbeafe; }
  .modal .modal-tip { font-size: 12px; color: #64748b; margin: 10px 0 12px; text-align: center; }
  .modal .modal-close {
    width: 100%; padding: 10px; border: none; border-radius: 8px;
    background: linear-gradient(135deg, #1e6cb6, #2b8fd6); color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
</style>
<script src="xlsx.full.min.js"></script>

// —— 单行适配：名称/执照超宽时智能缩小字号保持一行，避免换行或裁切 ——
function fitSingleLine(el, minSize) {
  if (!el) return true;
  if (el.scrollWidth <= el.clientWidth + 0.5) return true;
  let size = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth + 0.5 && size > minSize) {
    size -= 0.5;
    el.style.fontSize = size + 'px';
  }
  if (el.scrollWidth > el.clientWidth + 0.5) {
    let ls = 0;
    while (el.scrollWidth > el.clientWidth + 0.5 && ls > -0.6) {
      ls -= 0.1;
      el.style.letterSpacing = ls + 'px';
    }
  }
  return el.scrollWidth <= el.clientWidth + 0.5;
}
function resetFit(el) {
  if (!el) return;
  el.style.fontSize = '';
  el.style.letterSpacing = '';
}
function fitCardItem(item) {
  const nameEl = item.querySelector('.c-name');
  const licEl = item.querySelector('.c-license');
  item.classList.remove('narrow-right');
  resetFit(nameEl); resetFit(licEl);
  let ok = fitSingleLine(nameEl, 10) & fitSingleLine(licEl, 9.5);
  if (!ok) {
    item.classList.add('narrow-right');
    resetFit(nameEl); resetFit(licEl);
    fitSingleLine(nameEl, 10);
    fitSingleLine(licEl, 9.5);
  }
}

// —— 手机端：卡片超屏自动换行为1列 ——
function adjustMobileLayout() {
  if (window.innerWidth > 640) return;
  var items = Array.from(document.querySelectorAll('.card-item'));
  items.forEach(function(item) {
    item.classList.remove('full-width');
    item.style.borderRight = '';
  });
  document.body.offsetHeight; // force reflow
  var col = 0;
  items.forEach(function(item) {
    var nameEl = item.querySelector('.c-name');
    var licEl = item.querySelector('.c-license');
    var truncated = false;
    if (nameEl && nameEl.scrollWidth > nameEl.clientWidth + 0.5) truncated = true;
    if (licEl && licEl.scrollWidth > licEl.clientWidth + 0.5) truncated = true;
    if (truncated) {
      item.classList.add('full-width');
      resetFit(nameEl); resetFit(licEl);
      fitSingleLine(nameEl, 10);
      fitSingleLine(licEl, 9.5);
      item.style.borderRight = 'none';
      col = 0;
    } else {
      if (col === 1) { item.style.borderRight = 'none'; col = 0; }
      else { item.style.borderRight = '1px solid #d1d5db'; col = 1; }
    }
  });
}

// ============================================================
// 导出A4打印图片：按分类绘制A4竖版PNG，自动分页+相邻分类合并
// ============================================================
var A4_W = 1240, A4_H = 1754;          // 150dpi A4竖版
var HEAD_H = 100, CAT_H = 64, ROW_H = 72, ROW_H_2COL = 78, FOOT_H = 56, PAGE_GAP = 30;
var PAGE_TITLE = '明厨亮灶专项行动 · 六榕所辖区跟进汇报';
var metaText = (function () {
  var m = document.querySelector('.header .meta');
  return m ? m.textContent.replace(/\s+/g, ' ').trim() : '';
})();
var PAGE_FOOT = '明厨亮灶专项行动 · 六榕所辖区 · 中山五营服中心';
var CAT_COLORS = {
  '已上线': '#10b981', '用户拒绝': '#ef4444', '已安装': '#3b82f6',
  '已受理': '#f59e0b', '已联系': '#64748b'
};

// 构建页面：已上线单页双列排满；其他分类单列，放不下开新页、相邻合并
function buildA4Pages() {
  var pages = [];
  CATEGORIES.forEach(function (cat) {
    var items = DATA.filter(function (d) { return d.status === cat.key; });
    if (items.length === 0) return;
    if (cat.key === '已上线') {
      // 已上线：单独一页，双列排布
      pages.push({ cats: [{ cat: cat.key, items: items, twoCol: true }] });
    } else if (cat.key === '已联系') {
      // 已联系：单独一页（单列），不跟前面挤，避免分拆到两页
      pages.push({ cats: [{ cat: cat.key, items: items, twoCol: false }] });
    } else {
      // 其他分类：单列，逐行排入当前页（可与前页剩余空间合并）
      var cur = pages.length > 0 ? pages[pages.length - 1] : null;
      if (!cur || cur.cats[cur.cats.length - 1].twoCol) {
        cur = { cats: [] }; pages.push(cur);
      }
      var used = HEAD_H + FOOT_H;
      cur.cats.forEach(function (s) {
        used += CAT_H + (s.items.length * ROW_H);
      });
      // 当前页放不下分类头+首行 → 开新页
      if (cur.cats.length > 0 && used + CAT_H + ROW_H > A4_H - FOOT_H - PAGE_GAP) {
        cur = { cats: [] }; pages.push(cur); used = HEAD_H + FOOT_H;
      }
      var i = 0;
      while (i < items.length) {
        if (used + ROW_H > A4_H - FOOT_H - PAGE_GAP) {
          cur = { cats: [] }; pages.push(cur); used = HEAD_H + FOOT_H;
        }
        if (cur.cats.length === 0 || cur.cats[cur.cats.length - 1].cat !== cat.key) {
          cur.cats.push({ cat: cat.key, items: [], twoCol: false });
          used += CAT_H;
        }
        cur.cats[cur.cats.length - 1].items.push(items[i]);
        used += ROW_H;
        i++;
      }
    }
  });
  return pages;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function truncateText(ctx, text, maxWidth) {
  if (!text) return '';
  var t = String(text);
  if (ctx.measureText(t).width <= maxWidth) return t;
  var lo = 0, hi = t.length;
  while (lo < hi) {
    var mid = (lo + hi + 1) >> 1;
    if (ctx.measureText(t.slice(0, mid) + '…').width <= maxWidth) lo = mid;
    else hi = mid - 1;
  }
  return t.slice(0, lo) + '…';
}

function drawA4Page(ctx, page, pageIdx, total) {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, A4_W, A4_H);

  // 顶部标题栏
  var grad = ctx.createLinearGradient(0, 0, A4_W, 0);
  grad.addColorStop(0, '#1e6cb6');
  grad.addColorStop(1, '#2b8fd6');
  ctx.fillStyle = grad;
  roundRect(ctx, 14, 14, A4_W - 28, HEAD_H - 20, 10);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 30px "Microsoft YaHei","PingFang SC",sans-serif';
  ctx.fillText(PAGE_TITLE, A4_W / 2, 52);
  ctx.font = '16px "Microsoft YaHei","PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  var metaLine = metaText + '    第 ' + pageIdx + ' / ' + total + ' 页';
  ctx.fillText(metaLine, A4_W / 2, 84);

  var y = HEAD_H + 8;
  ctx.textAlign = 'left';
  page.cats.forEach(function (sec) {
    var cat = sec.cat;
    // 分类头
    ctx.fillStyle = CAT_COLORS[cat] || '#64748b';
    ctx.beginPath();
    ctx.arc(28, y + 18, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 22px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillText(cat + '（' + sec.items.length + '户）', 46, y + 25);
    y += CAT_H;

    if (sec.twoCol) {
      // ====== 双列布局（已上线）======
      var colW = (A4_W - 56) / 2;  // 每列宽度（含间距）
      var leftColX = 28;
      var rightColX = 28 + colW + 0;
      var halfCount = Math.ceil(sec.items.length / 2);
      var rowY = y;
      for (var idx = 0; idx < sec.items.length; idx++) {
        var col = idx < halfCount ? 0 : 1;
        var rowInCol = col === 0 ? idx : idx - halfCount;
        var top = y + rowInCol * ROW_H_2COL;
        var colX = col === 0 ? leftColX : rightColX;

        // 行底分隔线
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(colX, top + ROW_H_2COL - 1);
        ctx.lineTo(colX + colW - 8, top + ROW_H_2COL - 1);
        ctx.stroke();

        // 序号
        ctx.fillStyle = '#94a3b8';
        ctx.font = '15px "Microsoft YaHei","PingFang SC",sans-serif';
        ctx.fillText(String(idx + 1), colX, top + 24);

        // 第一行：营业执照名称（加大加粗）
        var nameX = colX + 30;
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 20px "Microsoft YaHei","PingFang SC",sans-serif';
        var licMaxW = colW - 30 - 16;
        var licText = sec.items[idx].license || '—';
        ctx.fillText(truncateText(ctx, licText, licMaxW), nameX, top + 24);

        // 第二行：客户名称（不加粗，与执照同字号）
        var isTakeout = TAKEOUT_KITCHENS.indexOf(sec.items[idx].name) >= 0;
        ctx.fillStyle = '#475569';
        ctx.font = '20px "Microsoft YaHei","PingFang SC",sans-serif';
        var nameMaxW = colW - 30 - 16 - (isTakeout ? 72 : 0);
        var nameText = truncateText(ctx, sec.items[idx].name, nameMaxW);
        ctx.fillText(nameText, nameX, top + 50);

        // 外卖厨房标签（跟客户名称在第二行）
        if (isTakeout) {
          var tagText = '外卖厨房';
          var tagW2 = 62;
          var tagX = nameX + ctx.measureText(nameText).width + 8;
          if (tagX + tagW2 > colX + colW - 8) tagX = colX + colW - 8 - tagW2;
          ctx.fillStyle = '#ffedd5';
          roundRect(ctx, tagX, top + 36, tagW2, 20, 4);
          ctx.fill();
          ctx.fillStyle = '#c2410c';
          ctx.font = 'bold 12px "Microsoft YaHei","PingFang SC",sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(tagText, tagX + tagW2 / 2, top + 50);
          ctx.textAlign = 'left';
        }
      }
      y += halfCount * ROW_H_2COL;
    } else {
      // ====== 单列布局（其他分类）======
      sec.items.forEach(function (d, i) {
        var top = y;
        // 行底分隔线
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(24, top + ROW_H - 1);
        ctx.lineTo(A4_W - 24, top + ROW_H - 1);
        ctx.stroke();

        // 序号
        ctx.fillStyle = '#94a3b8';
        ctx.font = '15px "Microsoft YaHei","PingFang SC",sans-serif';
        ctx.fillText(String(i + 1), 28, top + 26);

        // 第一行：营业执照名称（加大加粗）
        var nameX = 58;
        var rightW = 380;
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 20px "Microsoft YaHei","PingFang SC",sans-serif';
        var licMaxW = A4_W - nameX - rightW - 16;
        var licText = d.license || '—';
        ctx.fillText(truncateText(ctx, licText, licMaxW), nameX, top + 26);

        // 第二行：客户名称（不加粗，与执照同字号）
        var isTakeout = TAKEOUT_KITCHENS.indexOf(d.name) >= 0;
        ctx.fillStyle = '#475569';
        ctx.font = '20px "Microsoft YaHei","PingFang SC",sans-serif';
        var nameMaxW = A4_W - nameX - rightW - 16 - (isTakeout ? 82 : 0);
        var nameText = truncateText(ctx, d.name, nameMaxW);
        ctx.fillText(nameText, nameX, top + 52);

        // 外卖厨房标签（跟客户名称在第二行）
        if (isTakeout) {
          var tagText = '外卖厨房';
          var tagW2 = 66;
          var tagX = nameX + ctx.measureText(nameText).width + 8;
          ctx.fillStyle = '#ffedd5';
          roundRect(ctx, tagX, top + 38, tagW2, 22, 4);
          ctx.fill();
          ctx.fillStyle = '#c2410c';
          ctx.font = 'bold 12px "Microsoft YaHei","PingFang SC",sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(tagText, tagX + tagW2 / 2, top + 52);
          ctx.textAlign = 'left';
        }

        // 右侧：进度说明/拒绝原因（与第一行对齐）
        var descText = d.desc || '—';
        ctx.fillStyle = d.desc ? '#475569' : '#cbd5e1';
        ctx.font = '15px "Microsoft YaHei","PingFang SC",sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(truncateText(ctx, descText, rightW), A4_W - 28, top + 30);
        ctx.textAlign = 'left';

        y += ROW_H;
      });
    }
  });

  // 页脚
  ctx.fillStyle = '#94a3b8';
  ctx.font = '15px "Microsoft YaHei","PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(PAGE_FOOT, A4_W / 2, A4_H - 24);
  ctx.textAlign = 'left';
}

function downloadBlob(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 500);
}

// ============================================================
// 导出A4打印图片：优先弹出预生成真实图片列表（兼容微信/下载工具）；
// 文件不存在时降级为前端即时生成
// ============================================================
var STATIC_A4 = ['明厨亮灶-六榕所-A4-第1页.png','明厨亮灶-六榕所-A4-第2页.png','明厨亮灶-六榕所-A4-第3页.png']; // 生成汇报时替换为实际图片文件名数组，如 ['明厨亮灶-六榕所-A4-第1页.png',...]
function exportPrintImagesFrontend() {
  var pages = buildA4Pages();
  if (pages.length === 0) { alert('暂无数据可导出'); return; }
  pages.forEach(function (pg, idx) {
    var canvas = document.createElement('canvas');
    canvas.width = A4_W;
    canvas.height = A4_H;
    var ctx = canvas.getContext('2d');
    drawA4Page(ctx, pg, idx + 1, pages.length);
    canvas.toBlob(function (blob) {
      if (blob) downloadBlob(blob, '明厨亮灶-六榕所-A4-第' + (idx + 1) + '页.png');
    }, 'image/png');
  });
}
function openPrintModal() {
  var pages = buildA4Pages();
  var html = '';
  STATIC_A4.forEach(function (f, i) {
    var cats = (pages[i] ? pages[i].cats.map(function (s) { return s.cat + ' ' + s.items.length + '户'; }).join('、') : '');
    html += '<a class="modal-item" href="' + f + '" target="_blank" download="' + f + '">第' + (i + 1) + '页：' + cats + '</a>';
  });
  document.getElementById('modalPageCount').textContent = STATIC_A4.length;
  document.getElementById('modalList').innerHTML = html;
  document.getElementById('printModal').classList.add('show');
}
document.getElementById('modalClose').addEventListener('click', function () {
  document.getElementById('printModal').classList.remove('show');
});
document.getElementById('printModal').addEventListener('click', function (e) {
  if (e.target === this) this.classList.remove('show');
});
document.getElementById('btnPrint').addEventListener('click', function () {
  if (!STATIC_A4 || STATIC_A4.length === 0) { exportPrintImagesFrontend(); return; }
  fetch(STATIC_A4[0], { method: 'HEAD' }).then(function (r) {
    if (r.ok) { openPrintModal(); } else { exportPrintImagesFrontend(); }
  }).catch(function () { exportPrintImagesFrontend(); });
});
</script>
